<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>Site en construction - BOITAUXLETTRES FRANCE</title>
    <link rel="icon" type="image/png" href="public/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e1c;
            color: #fff;
            overflow: hidden;
        }

        .construction {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background:
                radial-gradient(
                    circle at 65% 40%,
                    rgba(28, 46, 92, 0.55),
                    rgba(14, 19, 36, 0.85) 45%,
                    rgba(10, 14, 28, 1) 75%
                ),
                radial-gradient(
                    circle at 15% 50%,
                    rgba(255, 122, 24, 1),
                    rgba(255, 122, 24, 0.8) 25%,
                    rgba(255, 122, 24, 0.6) 45%,
                    rgba(255, 122, 24, 0.35) 65%,
                    rgba(14, 19, 36, 0.85) 95%
                );
            position: relative;
        }

        .construction::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.4;
        }

        .construction-content {
            position: relative;
            z-index: 1;
            max-width: 600px;
        }

        .construction-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .construction h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #ffb380 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .construction p {
            font-size: 18px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 16px;
        }

        .construction p.subtitle {
            font-size: 20px;
            color: #ffb380;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .progress-bar {
            margin-top: 40px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ff7a18, transparent);
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        .footer-text {
            margin-top: 50px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 600px) {
            .construction-icon {
                font-size: 60px;
                margin-bottom: 20px;
            }

            .construction h1 {
                font-size: 32px;
            }

            .construction p {
                font-size: 16px;
            }

            .construction p.subtitle {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="construction">
        <div class="construction-content">
            <div class="construction-icon">🚧</div>
            <h1>Site en construction</h1>
            <p class="subtitle">Nous travaillons actuellement sur cette page</p>
            <p>Notre site sera bientôt disponible. Merci de votre patience.</p>
            <div class="progress-bar"></div>
            <p class="footer-text">© BOITAUXLETTRES FRANCE</p>
        </div>
    </div>
</body>
</html>
